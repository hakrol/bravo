<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Foreslått minstelønn for renholdere</title>
  <desc id="desc">Stilisert renholdsutstyr og et skilt som viser den foreslåtte satsen på 247,29 kroner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7efe5"/>
      <stop offset="1" stop-color="#f6eddb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#23352a" flood-opacity=".18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1325" cy="150" r="190" fill="#d98b2b" opacity=".17"/>
  <path d="M0 715 C255 650 470 790 760 710 C1040 635 1295 735 1600 650 V900 H0Z" fill="#d6dfd0"/>

  <g transform="translate(900 185)">
    <path d="M430 45 L285 610" fill="none" stroke="#14532d" stroke-width="30" stroke-linecap="round"/>
    <path d="M238 580 H410 L460 675 H190Z" fill="#d98b2b" stroke="#14532d" stroke-width="10" stroke-linejoin="round"/>
    <path d="M225 625 H425" fill="none" stroke="#fffdf8" stroke-width="10" stroke-linecap="round" opacity=".8"/>

    <g transform="translate(0 225)">
      <path d="M65 78 H225 L260 430 H30Z" fill="#77917c" stroke="#14532d" stroke-width="10" stroke-linejoin="round"/>
      <path d="M98 78 V22 H198 V78" fill="none" stroke="#14532d" stroke-width="18" stroke-linecap="round"/>
      <path d="M55 180 H237" fill="none" stroke="#f3eee2" stroke-width="12" opacity=".8"/>
      <circle cx="88" cy="445" r="28" fill="#17201b"/>
      <circle cx="210" cy="445" r="28" fill="#17201b"/>
    </g>

    <g transform="translate(500 285)">
      <path d="M70 0 H188 L215 62 H52Z" fill="#14532d"/>
      <path d="M109 62 H177 V118 H109Z" fill="#d98b2b"/>
      <path d="M78 108 H205 L235 405 H42Z" fill="#fffdf8" stroke="#14532d" stroke-width="10" stroke-linejoin="round"/>
      <rect x="70" y="205" width="136" height="82" rx="5" fill="#d6dfd0"/>
      <path d="M78 10 H8" fill="none" stroke="#14532d" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>

  <g filter="url(#shadow)" transform="translate(120 485)">
    <rect width="500" height="250" rx="8" fill="#fffdf8"/>
    <rect width="18" height="250" rx="8" fill="#d98b2b"/>
    <text x="58" y="62" fill="#526159" font-family="Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">FORESLÅTT SATS</text>
    <text x="55" y="145" fill="#14532d" font-family="Arial, sans-serif" font-size="76" font-weight="800">247,29 kr</text>
    <text x="58" y="202" fill="#17201b" font-family="Arial, sans-serif" font-size="32">per time</text>
  </g>

  <rect y="840" width="1600" height="60" fill="#14532d"/>
</svg>
